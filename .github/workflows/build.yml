name: Build Meow++ (Windows)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: |
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-llvm
          mingw-w64-x86_64-clang
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-pkg-config
    
    - name: Build Meow++
      run: |
        # Use mingw32-make instead of make (MSYS2 naming)
        export LLVM_CONFIG=/mingw64/bin/llvm-config
        mingw32-make
    
    - name: Test Interpreter
      run: |
        ./meowplus.exe -r examples/hello.meowplus
    
    - name: Test Compiler
      run: |
        ./meowplus.exe examples/hello.meowplus -o hello.exe -O2
        ./hello.exe
    
    - name: Test REPL
      run: |
        echo "purr purr meow" | ./meowplus.exe -i
    
    - name: Test Loops
      run: |
        echo "# Loop test
        paw purr purr purr purr purr
        ifmeow
          meow
          pawback purr
          paw
          hiss
        endmeow" > test.meowplus
        ./meowplus.exe -r test.meowplus
    
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: meowplus-windows
        path: meowplus.exe