name: Build Meow++ (Windows - Interpreter Only)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: |
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
    
    - name: Build Meow++ (Interpreter only)
      run: |
        # Build without LLVM
        gcc -Iinclude -o meowplus.exe src/lexer.c src/parser.c src/interpreter.c src/main.c
    
    - name: Test Interpreter
      run: |
        ./meowplus.exe -r examples/hello.meowplus
    
    - name: Test REPL
      run: |
        echo "purr purr meow" | ./meowplus.exe -i
    
    - name: Test Loops
      run: |
        echo "# Loop test
        paw purr purr purr purr purr
        ifmeow
          meow
          pawback purr
          paw
          hiss
        endmeow" > test.meowplus
        ./meowplus.exe -r test.meowplus
    
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: meowplus-windows-interpreter
        path: meowplus.exe